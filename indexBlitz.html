<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Galiano BioBlitz 2023 Outcomes: vascular plants</title>

        <!-- Infusion 6 is loaded from node_modules, so this page may be served from this checkout -->

        <!-- The one reference to the location of Infusion - every other is relative, or through a module -->
        <script src="docs/vendor/infusion-6/src/framework/core/js/FluidBoot.js" data-fluid-dev-mode></script>
        <!-- This checkout, as the module holding the page, and its map of the modules it depends upon - see
             Infusion 6's copyOut.js --in-place -->
        <fluid-module id="imerss-bioinfo" src="./" modules="fluid-modules.json"></fluid-module>

        <!-- The visualisation, which imports every Single File Component, script and stylesheet it depends on -->
        <fluid-import src="src/client/sfc/core/hortis-blitzVizLoader.vue"></fluid-import>
        <script>
            "use strict";

            // The visualisation of the vascular plants of the Galiano BioBlitz 2023. Its data package
            // is relative to the page
            fluid.def("hortis.blitz.galiano", {
                $layers: "hortis.blitzVizLoader",
                title: "Galiano BioBlitz 2023 Outcomes: vascular plants",
                vizFile: "data/Galiano 2023 BioBlitz/Galiano_Island_vascular_plant_records_consolidated-prepared.viz"
            });
        </script>
    </head>

    <body>
        <div fluid-layers="hortis.blitz.galiano"></div>
    </body>
</html>
