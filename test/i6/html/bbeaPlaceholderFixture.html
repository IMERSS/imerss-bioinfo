<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>BBEA visualisation on placeholder data</title>

        <!-- A fixture for test/i6/bbeaHydrationRoundTrip.js - the plant-pollinator visualisation as it is, so that it is
             rendered from the placeholder its layer declares, of 8 observations of the Washington Bee Atlas, both
             when hydrated and in the browser - see FLUID-7032. Served from the root of this checkout, as are the pages
             it imitates, e.g. indexBeasWaBA.html -->

        <script src="../../../node_modules/infusion-6/src/framework/core/js/FluidBoot.js"></script>
        <fluid-module id="imerss-bioinfo" src="../../../" modules="fluid-modules.json"></fluid-module>

        <fluid-import src="../../../src/client/sfc/bbea/hortis-beaVizLoader.vue"></fluid-import>
        <script>
            "use strict";
            fluid.def("hortis.bbea.placeholderFixture", {
                $layers: "hortis.beaVizLoader",
                stateCode: "WA",
                softwareVersion: "Test fixture",
                datasetVersion: "Placeholder data"
            });
        </script>
    </head>

    <body>
        <h2>BBEA TTOOL</h2>
        <div fluid-layers="hortis.bbea.placeholderFixture"></div>
    </body>
</html>
