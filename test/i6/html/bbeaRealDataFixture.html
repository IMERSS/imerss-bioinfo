<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>BBEA visualisation on real data</title>

        <!-- A fixture of the plant-pollinator visualisation configured with the real data of the Washington Bee Atlas, as
             a runnable application is. Served from the root of this checkout, as are the pages it imitates, e.g.
             indexBeasWaBA.html -->

        <script src="../../../node_modules/infusion-6/src/framework/core/js/FluidBoot.js"></script>
        <fluid-module id="imerss-bioinfo" src="../../../" modules="fluid-modules.json"></fluid-module>

        <fluid-import src="../../../src/client/sfc/bbea/hortis-beaVizLoader.vue"></fluid-import>
        <script>
            "use strict";
            fluid.def("hortis.bbea.realDataFixture", {
                $layers: "hortis.beaVizLoader",
                vizFile: "../../../data/b-team/plant-pollinators-WaBA-2026.viz",
                stateCode: "WA",
                softwareVersion: "Test fixture",
                datasetVersion: "Real data"
            });
        </script>
    </head>

    <body>
        <h2>BBEA TTOOL</h2>
        <div fluid-layers="hortis.bbea.realDataFixture"></div>
    </body>
</html>
