<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>BBEA visualisation on Infusion 6 - shell and views tests</title>
        <!-- Run from this checkout with
             node node_modules/infusion-6/tests/test-core/qunit/js/fqunit-cli.js test/i6/html/BbeaViewsTests.html
             Infusion 6 is that installed by npm into node_modules -->
        <!-- The one reference to the location of Infusion - every other is relative, or through a module -->
        <script src="../../../node_modules/infusion-6/src/framework/core/js/FluidBoot.js"></script>
        <!-- This checkout, as the module holding the page, and its map of the modules it depends upon - see
             Infusion 6's copyOut.js --in-place -->
        <fluid-module id="imerss-bioinfo" src="../../../" modules="fluid-modules.json"></fluid-module>
        <script src="../../../node_modules/infusion-6/tests/lib/qunit/js/qunit.js"></script>
        <script src="../../../node_modules/infusion-6/tests/test-core/qunit/js/qunit-fluid.js"></script>
        <!-- The visualisation, which imports every SFC, script and stylesheet it depends on -->
        <fluid-import src="../../../src/client/sfc/bbea/hortis-beaVizLoader.vue"></fluid-import>
        <script src="../js/BbeaTestSupport.js"></script>
        <script src="../js/BbeaTestData.js"></script>
        <script src="../js/BbeaViewsTests.js"></script>
    </head>
    <body>
        <div id="qunit"></div>
        <div id="qunit-fixture">
            <div class="bbea-root"></div>
        </div>
    </body>
</html>
