<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>BBEA TTOOL BCBA</title>

        <!-- Infusion 6 is loaded from node_modules, so this page may be served from this checkout -->

        <!-- The one reference to the location of Infusion - every other is relative, or through a module -->
        <script src="node_modules/infusion-6/src/framework/core/js/FluidBoot.js"></script>
        <!-- This checkout, as the module holding the page, and its map of the modules it depends upon - see
             Infusion 6's copyOut.js --in-place -->
        <fluid-module id="imerss-bioinfo" src="./" modules="fluid-modules.json"></fluid-module>

        <!-- The plant-pollinator visualisation, which imports every Single File Component, script and stylesheet it
             depends on -->
        <fluid-import src="src/client/sfc/bbea/hortis-beaVizLoader.vue"></fluid-import>
        <script>
            "use strict";
            // The plant-pollinator visualisation of the BC Bee Atlas dataset. Its data files are relative to this page, each
            // with a placeholder of the same shape from which the page is rendered statically by Infusion 6's hydrate.js
            fluid.def("hortis.bbea.bcba", {
                $layers: "hortis.beaVizLoader",
                obsFile: "data/b-team/plant-pollinators-BCBA-labels.viz",
                obsPlaceholderFile: "data/b-team/placeholder/plant-pollinators-BCBA-labels.viz",
                taxaFile: "data/b-team/plant-pollinators-BCBA-assigned-taxa.viz",
                taxaPlaceholderFile: "data/b-team/placeholder/plant-pollinators-BCBA-assigned-taxa.viz",
                regionIndirectionFile: "data/b-team/plant-pollinators-BCBA-regionIndirection.csv",
                regionIndirectionPlaceholderFile: "data/b-team/placeholder/plant-pollinators-BCBA-regionIndirection.csv",
                // The state whose volunteer reports are linked to
                stateCode: "BC",
                softwareVersion: "Software Version 1.2 - Updated February 17th, 2026",
                datasetVersion: "Dataset Revision V1 - Updated March 4th, 2026",
                // The leading fields of the region filter, by which its regions are grouped
                regionLeadingFields: ["BC Ecoprovinces"]
            });
        </script>
    </head>

    <body>
        <h2>BBEA TTOOL</h2>
        <div fluid-layers="hortis.bbea.bcba"></div>
    </body>
</html>
