<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Diatoms of the Salish Sea</title>

        <!-- This page is written as it is served from docs, into which build.js copies it, together with the modules it
             depends upon, by Infusion 6's copyOut.js, and then hydrates it in place - see build.js -->
        <!-- The one reference to the location of Infusion - every other is relative, or through a module -->
        <script src="vendor/infusion-6/src/framework/core/js/FluidBoot.js"></script>
        <!-- The site, as the module holding the page, and its map of the modules it depends upon, written by copyOut.js -->
        <fluid-module id="imerss-bioinfo-docs" src="./" modules="fluid-modules.json"></fluid-module>

        <!-- The visualisation, which imports every Single File Component, script and stylesheet it depends on -->
        <fluid-import src="%imerss-bioinfo/src/client/sfc/core/hortis-standardVizLoader.vue"></fluid-import>
        <script>
            "use strict";

            // The visualisation of the marine diatoms of the Salish Sea. Its data files are
            // relative to the page
            fluid.def("hortis.diatoms.salish", {
                $layers: "hortis.standardVizLoader",
                title: "Diatoms of the Salish Sea",
                gridResolution: 2000,
                obsFile: "data/dataPaper-II/Salish_Sea_marine_diatom_records_consolidated_aligned_2025-03-prepared.csv",
                obsPlaceholderFile: "data/dataPaper-II/placeholder/Salish_Sea_marine_diatom_records_consolidated_aligned_2025-03-prepared.csv",
                taxaFile: "data/dataPaper-II/Salish_Sea_marine_diatom_records_consolidated_aligned_2025-03-assigned-taxa.csv",
                taxaPlaceholderFile: "data/dataPaper-II/placeholder/Salish_Sea_marine_diatom_records_consolidated_aligned_2025-03-assigned-taxa.csv",
                regionIndirectionFile: "data/dataPaper-II/regionIndirection.csv",
                regionIndirectionPlaceholderFile: "data/dataPaper-II/placeholder/regionIndirection.csv"
            });
        </script>
    </head>

    <body>
        <div fluid-layers="hortis.diatoms.salish"></div>
    </body>
</html>
