<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Galiano BioBlitz 2023 Outcomes: vascular plants</title>

        <!-- This page is written as it is served from docs, into which build.js copies it, together with the modules it
             depends upon, by Infusion 6's copyOut.js, and then hydrates it in place - see build.js -->
        <!-- The one reference to the location of Infusion - every other is relative, or through a module -->
        <script src="vendor/infusion-6/src/framework/core/js/FluidBoot.js"></script>
        <!-- The site, as the module holding the page, and its map of the modules it depends upon, written by copyOut.js -->
        <fluid-module id="imerss-bioinfo-docs" src="./" modules="fluid-modules.json"></fluid-module>

        <!-- The visualisation, which imports every Single File Component, script and stylesheet it depends on -->
        <fluid-import src="%imerss-bioinfo/src/client/sfc/core/hortis-blitzVizLoader.vue"></fluid-import>
        <script>
            "use strict";

            // The visualisation of the vascular plants of the Galiano BioBlitz 2023. Its data files
            // are relative to the page
            fluid.def("hortis.blitz.galiano", {
                $layers: "hortis.blitzVizLoader",
                title: "Galiano BioBlitz 2023 Outcomes: vascular plants",
                obsFile: "data/Galiano 2023 BioBlitz/Galiano_Island_vascular_plant_records_consolidated-prepared.csv",
                obsPlaceholderFile: "data/Galiano 2023 BioBlitz/placeholder/Galiano_Island_vascular_plant_records_consolidated-prepared.csv",
                taxaFile: "data/Galiano 2023 BioBlitz/Galiano_Island_vascular_plant_records_consolidated-prepared-taxa.csv",
                taxaPlaceholderFile: "data/Galiano 2023 BioBlitz/placeholder/Galiano_Island_vascular_plant_records_consolidated-prepared-taxa.csv",
                regionIndirectionFile: "data/Galiano 2023 BioBlitz/regionIndirection.csv",
                regionIndirectionPlaceholderFile: "data/Galiano 2023 BioBlitz/placeholder/regionIndirection.csv"
            });
        </script>
    </head>

    <body>
        <div fluid-layers="hortis.blitz.galiano"></div>
    </body>
</html>
